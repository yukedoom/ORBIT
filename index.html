<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>奇跡体験！アンビリバボー シャッフル</title>
<style>
:root{--bg:#f3f0e8;--fg:#1d1a16;--sub:#6b655b;--accent:#c4122f;--gold:#c98a00;--btn:#1d1a16;--btnfg:#f3f0e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--fg:#f1eee6;--sub:#9a968b;--accent:#ff4d5e;--gold:#ffd23f;--btn:#f1eee6;--btnfg:#14161c}}
:root[data-theme="dark"]{--bg:#14161c;--fg:#f1eee6;--sub:#9a968b;--accent:#ff4d5e;--gold:#ffd23f;--btn:#f1eee6;--btnfg:#14161c}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
main{text-align:center;padding:24px;width:100%;max-width:900px}
#text{font-size:clamp(28px,7vw,64px);font-weight:800;letter-spacing:.04em;line-height:1.3;word-break:keep-all}
#text .hit{color:var(--gold);text-shadow:0 0 18px var(--gold)}
#text.done span{color:var(--accent);text-shadow:0 0 24px var(--accent)}
#text.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#text.shake{animation:shake .35s}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#label{min-height:1.6em;margin-top:8px;font-size:clamp(20px,4vw,32px);font-weight:800;color:var(--gold)}
#label.big{color:var(--accent)}
.count{margin:16px 0 28px;color:var(--sub);font-size:clamp(16px,3vw,22px)}
#n{display:block;color:var(--fg);font-size:clamp(40px,10vw,88px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
button{font:inherit;font-size:20px;font-weight:700;padding:14px 40px;border:0;border-radius:8px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--sub);font-size:15px;padding:10px 16px;margin-left:12px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#result{min-height:1.5em;margin-top:24px;font-size:clamp(15px,2.6vw,19px);color:var(--fg)}
#best{margin-top:6px;color:var(--sub);font-size:15px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .6s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#text.pop,#text.shake,#flash.on{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="flash"></div>
<main>
<div id="text">奇跡体験！アンビリバボー</div>
<div id="label"></div>
<div class="count">試行回数<span id="n">0</span></div>
<div><button id="btn">スタート</button><button id="snd" class="ghost">音 ON</button></div>
<div id="result"></div>
<div id="best"></div>
</main>
<script>
const TA="奇跡体験",TB="アンビリバボー",A=[...TA],B=[...TB],PER_FRAME=2000;
const $=id=>document.getElementById(id);
const text=$("text"),nEl=$("n"),btn=$("btn"),snd=$("snd"),label=$("label"),result=$("result"),bestEl=$("best"),flash=$("flash"),cv=$("fx");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let count=0,tPrev=0,acc=0,running=false,raf=0,a=TA,b=TB,prevA=false,prevB=false,best=null,soundOn=true,ac=null;
try{const v=localStorage.getItem("kiseki-best-max");if(v)best=+v}catch(e){}
function showBest(){bestEl.textContent=best?"自己ベスト "+best.toLocaleString("ja-JP")+"回":"自己ベスト まだありません"}
showBest();

function shuf(x){x=x.slice();for(let i=x.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[x[i],x[j]]=[x[j],x[i]]}return x}
function retrig(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}

/* サウンド */
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function tone(f,t,d,v,type){if(!ac||!soundOn)return;const T=ac.currentTime+t,o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02)}
function sndReach(){tone(880,0,.06,.03)}
function sndBig(){[660,880,1320].forEach((f,i)=>tone(f,i*.09,.25,.12,"triangle"))}
function sndFanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.35,.14,"triangle"));[523,659,784,1047].forEach(f=>tone(f,.9,1.2,.08,"sine"))}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* 紙吹雪 */
function confetti(){
  if(reduce)return;
  const ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#ff4d5e","#ffd23f","#3ddc97","#4cc9f0","#b388ff","#ff9f1c"];
  const ps=Array.from({length:180},()=>({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*18,vy:-Math.random()*16-4,s:6+Math.random()*8,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t-t0<4000)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

function render(){
  const ra=a===TA,rb=b===TB;
  text.innerHTML='<span class="'+(ra?"hit":"")+'">'+a+'</span>！<span class="'+(rb?"hit":"")+'">'+b+"</span>";
  nEl.textContent=count.toLocaleString("ja-JP")+"回";
  if(rb){label.textContent="大リーチ！";label.className="big";if(!prevB){sndBig();vib(40);if(!reduce)retrig(text,"shake")}}
  else if(ra){label.textContent="リーチ！";label.className="";if(!prevA)sndReach()}
  else label.textContent="";
  prevA=ra;prevB=rb;
}
function finish(){
  running=false;render();
  text.classList.add("done");retrig(text,"pop");
  label.textContent="奇跡体験！！";label.className="big";
  btn.textContent="もう一度";
  retrig(flash,"on");confetti();sndFanfare();vib([200,80,200,80,400]);
  const p=(1-Math.pow(1-1/120960,count))*100;
  let msg="この回数までに当たる確率 "+(p<10?p.toFixed(1):p.toFixed(0))+"%";
  if(best===null||count>best){best=count;try{localStorage.setItem("kiseki-best-max",String(count))}catch(e){}msg="自己ベスト更新！　"+msg}
  result.textContent=msg;showBest();
}
function step(ts){
  if(!running)return;
  const dt=tPrev?Math.min((ts-tPrev)/1000,.1):0;tPrev=ts;
  acc+=(count<30?15:count*.72)*dt*(.8+Math.random()*.4);
  const n=Math.floor(acc);acc-=n;const t0=performance.now(); // 毎回回数をばらつかせて下位の桁も変化させる
  for(let i=0;i<n&&(i&255||performance.now()-t0<12);i++){
    count++;a=shuf(A).join("");b=shuf(B).join("");
    if(a===TA&&b===TB){finish();return}
  }
  render();raf=requestAnimationFrame(step);
}
btn.onclick=()=>{
  initAudio();
  if(running){running=false;cancelAnimationFrame(raf);btn.textContent="スタート";return}
  if(text.classList.contains("done")){count=0;text.classList.remove("done","pop");result.textContent="";label.textContent="";prevA=prevB=false}
  running=true;tPrev=0;acc=0;btn.textContent="ストップ";raf=requestAnimationFrame(step);
};
snd.onclick=()=>{initAudio();soundOn=!soundOn;snd.textContent=soundOn?"音 ON":"音 OFF"};
</script>
</body>
</html>
